version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    reviewers:
      - "oppia/analytics-data-platform-reviewers"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    reviewers:
      - "oppia/analytics-data-platform-reviewers"
    open-pull-requests-limit: 5
