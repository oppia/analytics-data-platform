version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    reviewers:
      - "oppia/analytics-data-platform-reviewers"
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    reviewers:
      - "oppia/analytics-data-platform-reviewers"
    open-pull-requests-limit: 2
