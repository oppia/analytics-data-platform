extends: default

ignore: |
  target/
  dbt_packages/
  dbt_modules/
  logs/
  .venv/
  venv/

rules:
  document-start: disable
  line-length: disable
  truthy:
    # GitHub Actions workflows use top-level 'on:' keys
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: whatever
