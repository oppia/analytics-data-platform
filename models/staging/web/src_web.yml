version: 2

sources:
  - name: raw_web_server
    # Dynamically switches servers based on your target (dev vs prod)
    database: "{{ 'oppiaserver' if target.name == 'prod' else 'oppiatestserver' }}"
    schema: "{{ 'analytics_261927573' if target.name == 'prod' else 'analytics_264617348' }}"
    tables:
      - name: events_*
        description: "Date-sharded GA4/Firebase event export tables (events_YYYYMMDD); query via wildcard with _TABLE_SUFFIX."
