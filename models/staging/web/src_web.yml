version: 2

sources:
  - name: raw_web_server
    # Dynamically switches servers based on your target (dev vs prod)
    database: "{{ 'oppiaserver' if target.name == 'prod' else 'oppiatestserver' }}"
    schema: raw_logs
    tables:
      - name: web_events_log
        description: "Raw untransformed event streaming records from the web client application."